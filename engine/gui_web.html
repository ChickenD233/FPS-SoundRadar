<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundRadar 声纹雷达</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1e28;
  --card2: #14181f;
  --accent: #00d2c8;
  --accent-dim: rgba(0, 210, 200, .35);
  --text: #d8dce6;
  --dim: #8a90a0;
  --danger: #e06060;
  --ok: #3fd97c;
  --warn: #e8b93f;
  --err: #e05050;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
  font-size: 13px;
  overflow-y: auto;   /* small screens only; window auto-fits on normal ones */
  overflow-x: hidden;
  user-select: none;
  border-radius: 10px;
}
/* thin dark scrollbar (fallback; content is sized to fit) */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }
::-webkit-scrollbar-track { background: transparent; }

/* frameless title bar */
#titlebar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px 10px 16px;
  -webkit-app-region: drag; /* JS bridge does the actual drag */
  cursor: default;
}
#titlebar h1 {
  font-size: 15px; font-weight: 600; letter-spacing: .5px;
  color: var(--accent);
  text-shadow: 0 0 14px var(--accent-dim);
}
#titlebar .sub { color: var(--dim); font-size: 11px; flex: 1; }
.tbtn {
  -webkit-app-region: no-drag;
  width: 30px; height: 24px; border: 0; border-radius: 6px;
  background: transparent; color: var(--dim); cursor: pointer;
  font-size: 13px; line-height: 1; transition: all .15s;
}
.tbtn:hover { background: rgba(255,255,255,.08); color: var(--text); }
.tbtn.close:hover { background: rgba(224,96,96,.18); color: var(--danger); }

#content { padding: 0 16px; }

.card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,.05);
  box-shadow: 0 2px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
  border-radius: 12px;
  padding: 10px 14px 12px;
  margin-bottom: 10px;
}
.card h2 {
  font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
  color: var(--accent); margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.card h2::after { content: ""; flex: 1; height: 1px; background: rgba(0,210,200,.18); }
.card h3 {
  font-size: 10px; font-weight: 600; letter-spacing: 1.2px;
  color: var(--dim); margin: 12px 0 4px;
  display: flex; align-items: center; gap: 8px;
}
.card h3::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.07); }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.row label { width: 88px; color: var(--dim); flex: none; }

/* value pill */
.val {
  width: 64px; flex: none; text-align: center;
  font-variant-numeric: tabular-nums; font-size: 11.5px;
  color: var(--accent); background: var(--card2);
  border: 1px solid rgba(0,210,200,.18);
  border-radius: 6px; padding: 2px 4px;
}

select {
  flex: 1; min-width: 0; background: var(--card2); color: var(--text);
  border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
  padding: 6px 10px; font-family: inherit; font-size: 12.5px; outline: none;
  transition: border-color .15s;
  text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
}
select:focus { border-color: var(--accent); }

/* segmented control */
.seg { display: flex; background: var(--card2); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button {
  flex: 1; border: 0; border-radius: 7px; padding: 7px 0; cursor: pointer;
  background: transparent; color: var(--dim); font-family: inherit; font-size: 12.5px;
  transition: all .15s;
}
.seg button.on {
  background: var(--accent); color: #06121a; font-weight: 600;
  box-shadow: 0 0 12px var(--accent-dim);
}

/* toggle pill */
.tgl { position: relative; width: 38px; height: 20px; flex: none; cursor: pointer; }
.tgl input { opacity: 0; width: 0; height: 0; }
.tgl .tr {
  position: absolute; inset: 0; border-radius: 20px; background: var(--card2);
  border: 1px solid rgba(255,255,255,.1); transition: all .18s ease;
}
.tgl .tr::after {
  content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--dim); transition: all .18s ease;
}
.tgl input:checked + .tr { background: rgba(0,210,200,.25); border-color: var(--accent); }
.tgl input:checked + .tr::after {
  left: 20px; background: var(--accent);
  box-shadow: 0 0 8px var(--accent-dim);
}
.tgl:active .tr::after { width: 18px; }
.tgl input:checked:active + .tr::after { left: 16px; }
.tgl-label { color: var(--text); }

/* range: thin track, glowing 16px thumb */
input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent) var(--fill,50%), #2a3040 var(--fill,50%));
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; border: 2px solid var(--accent);
  box-shadow: 0 0 10px var(--accent-dim), 0 0 3px var(--accent-dim);
  transition: transform .12s ease, box-shadow .12s ease;
}
input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.25);
  box-shadow: 0 0 16px var(--accent), 0 0 4px var(--accent-dim);
}
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }

/* weights grid */
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
.wgrid .row { margin: 3px 0; }
.wgrid .row label { width: 30px; color: var(--text); font-weight: 600; }
.wgrid .val { width: 46px; }

/* buttons */
.btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin: 2px 0 10px; }
button.act {
  border-radius: 9px; padding: 8px 16px; cursor: pointer; font-family: inherit;
  font-size: 12.5px; border: 1px solid var(--accent); background: transparent;
  color: var(--accent); transition: all .15s; white-space: nowrap;
}
button.act:hover { background: rgba(0,210,200,.12); box-shadow: 0 0 12px var(--accent-dim); }
button.act.primary { background: var(--accent); color: #06121a; font-weight: 600; }
button.act.primary:hover { box-shadow: 0 0 16px var(--accent); }
button.act.danger { border-color: var(--danger); color: var(--danger); }
button.act.danger:hover { background: rgba(224,96,96,.12); box-shadow: 0 0 12px rgba(224,96,96,.3); }
button.act.ghost { border-color: rgba(255,255,255,.15); color: var(--dim); }
button.act.ghost:hover { color: var(--text); background: rgba(255,255,255,.05); box-shadow: none; }

/* status footer */
footer {
  display: flex; align-items: center; gap: 10px;
  background: var(--card2); border-top: 1px solid rgba(255,255,255,.06);
  margin: 0; padding: 8px 16px;
}
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.6s infinite; }
.dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 1.6s infinite; }
.dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); }
@keyframes pulse { 50% { opacity: .45; } }
#statusText { font-size: 11.5px; color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; flex: none; }
.bars span {
  width: 5px; border-radius: 3px; background: var(--accent);
  box-shadow: 0 0 6px var(--accent-dim);
  opacity: .9; transition: height .1s linear; min-height: 2px;
}
</style>
</head>
<body>
<div id="titlebar">
  <h1>SoundRadar 声纹雷达</h1><span class="sub">声道方向声纹 · v@APP_VERSION@</span>
  <button class="tbtn" id="btnTitleMin" title="最小化到托盘">—</button>
  <button class="tbtn close" id="btnTitleClose" title="最小化到托盘">✕</button>
</div>
<div id="content">
<div class="seg" id="tabs" style="margin-bottom:10px">
  <button id="tabBasic" class="on">基础</button>
  <button id="tabAdv">高级</button>
</div>

<div id="pageBasic">
<div class="card">
  <h2>设备 DEVICES</h2>
  <div class="row"><label>输入/捕获</label><select id="selIn"></select></div>
  <div class="row"><label>输出</label><select id="selOut"></select></div>
  <div class="row"><label></label><button class="act ghost" id="btnSetDefault" style="flex:1">设为默认输出（系统声音走该设备）</button></div>
</div>

<div class="card">
  <h2>声纹 OVERLAY</h2>
  <div class="row"><label class="tgl-label">显示声纹</label>
    <label class="tgl"><input type="checkbox" id="ovOn"><span class="tr"></span></label>
  </div>
  <div class="row"><label>灵敏度 Sens.</label><input type="range" id="sens" min="50" max="400" step="10"><span class="val" id="sensV"></span></div>
</div>

<div class="card">
  <h2>更新 UPDATE</h2>
  <div class="row"><label>当前版本</label><span class="val" style="width:auto">v@APP_VERSION@</span>
    <span id="updText" style="flex:1;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis"></span></div>
  <div class="btns" style="margin-bottom:0">
    <button class="act ghost" id="btnCheckUpdate">检查更新</button>
    <button class="act primary" id="btnDoUpdate" hidden>立即更新</button>
  </div>
</div>
</div>

<div id="pageAdv" hidden>
<div class="card">
  <h2>配置 PRESETS</h2>
  <div class="row"><label>游戏预设</label><select id="preset">
    <option value="" disabled selected>选择预设…</option>
    <option value="default">默认</option>
    <option value="cs2">CS2</option>
    <option value="valorant">无畏契约</option>
    <option value="delta">三角洲行动</option>
  </select><button class="act ghost" id="btnPreset">载入预设</button></div>
  <div class="row"><label></label><button class="act ghost" id="btnExport" style="flex:1">导出配置</button>
  <button class="act ghost" id="btnImport" style="flex:1">导入配置</button></div>
</div>

<div class="card">
  <h2>声纹样式 OVERLAY</h2>
  <h3>内圈 · 方向箭头 INNER ARROWS</h3>
  <div class="row"><label>雷达大小</label><input type="range" id="radius" min="60" max="160" step="1"><span class="val" id="radiusV"></span></div>
  <div class="row"><label>位置X</label><input type="range" id="posX" min="-50" max="50" step="1"><span class="val" id="posXV"></span></div>
  <div class="row"><label>位置Y</label><input type="range" id="posY" min="0" max="50" step="1"><span class="val" id="posYV"></span></div>
  <div class="row"><label>渐隐时间</label><input type="range" id="fade" min="300" max="500" step="10"><span class="val" id="fadeV"></span></div>
  <div class="row"><label>指针淡出</label><input type="range" id="afade" min="150" max="1200" step="50"><span class="val" id="afadeV"></span></div>
  <h3>外圈 · 边缘条带 EDGE BANDS</h3>
  <div class="row"><label>条带粗细</label><input type="range" id="edgeW" min="50" max="250" step="5"><span class="val" id="edgeWV"></span></div>
  <div class="row"><label>条带长度</label><input type="range" id="edgeL" min="50" max="250" step="5"><span class="val" id="edgeLV"></span></div>
  <div class="row"><label>特效强度</label><input type="range" id="fx" min="0" max="100" step="1"><span class="val" id="fxV"></span></div>
  <div class="row"><label>阈值 绿→黄</label><input type="range" id="low" min="5" max="95" step="1"><span class="val" id="lowV"></span></div>
  <div class="row"><label>阈值 黄→红</label><input type="range" id="high" min="5" max="95" step="1"><span class="val" id="highV"></span></div>
</div>

<div class="card">
  <h2>检测 DETECTION</h2>
  <div class="row"><label>检测门限</label><input type="range" id="dth" min="0" max="10" step="0.5"><span class="val" id="dthV"></span></div>
  <div class="row"><label>分类能量门限</label><input type="range" id="cburst" min="1" max="15" step="0.5"><span class="val" id="cburstV"></span></div>
  <div class="row"><label class="tgl-label" style="width:auto">正前方融合</label>
    <label class="tgl"><input type="checkbox" id="fmerge"><span class="tr"></span></label>
  </div>
  <div class="row"><label class="tgl-label" style="width:auto">隐藏弹着点</label>
    <label class="tgl"><input type="checkbox" id="hideImp"><span class="tr"></span></label>
  </div>
</div>

<div class="card">
  <h2>屏蔽自己的声音 SELF-DUCK</h2>
  <div class="row"><label class="tgl-label">启用</label>
    <label class="tgl"><input type="checkbox" id="duckOn"><span class="tr"></span></label>
  </div>
  <div class="row"><label>开枪削弱</label><input type="range" id="duckFire" min="0" max="100" step="5"><span class="val" id="duckFireV"></span></div>
  <div class="row"><label>走路削弱</label><input type="range" id="duckWalk" min="0" max="100" step="5"><span class="val" id="duckWalkV"></span></div>
  <div class="row"><label>拖尾</label><input type="range" id="duckRel" min="100" max="600" step="20"><span class="val" id="duckRelV"></span></div>
  <div class="row"><label>前锥角</label><input type="range" id="duckCone" min="30" max="70" step="5"><span class="val" id="duckConeV"></span></div>
</div>

<div class="card">
  <h2>8 声道权重 WEIGHTS</h2>
  <div class="wgrid" id="wgrid"></div>
  <div class="btns" style="margin-top:6px"><button class="act ghost" id="resetW">重置 Reset</button></div>
</div>

<div class="card">
  <h2>其他 MISC</h2>
  <div class="row"><label class="tgl-label" style="width:auto">声音分类（实验性）</label>
    <label class="tgl"><input type="checkbox" id="clsOn"><span class="tr"></span></label>
  </div>
  <div class="row"><label class="tgl-label" style="width:auto">开机自启</label>
    <label class="tgl"><input type="checkbox" id="autoOn"><span class="tr"></span></label>
  </div>
</div>
</div>

<div class="btns">
  <button class="act danger" id="btnExit">退出程序</button>
  <button class="act ghost" id="btnMin">最小化到托盘</button>
  <button class="act primary" id="btnApply">应用 Apply</button>
</div>

<footer>
  <span class="dot warn" id="dot"></span>
  <span id="statusText">启动中…</span>
  <div class="bars" id="bars"></div>
</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const wNames = ["FL","FR","C","LFE","BL","BR","SL","SR"];
let state = null;

for (let i = 0; i < 8; i++) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${wNames[i]}</label>
    <input type="range" id="w${i}" min="0" max="150" step="5">
    <span class="val" id="w${i}V"></span>`;
  $('wgrid').appendChild(row);
}
for (let i = 0; i < 8; i++) {
  const b = document.createElement('span');
  b.id = 'bar' + i;
  $('bars').appendChild(b);
}

function setFill(el) {
  const pct = (el.value - el.min) / (el.max - el.min) * 100;
  el.style.setProperty('--fill', pct + '%');
}
function bindSlider(id, fmt) {
  const el = $(id);
  const show = () => { $(id + 'V').textContent = fmt(el.value); setFill(el); };
  el.addEventListener('input', show);
  el.addEventListener('change', () => { if (window.__instantApply) window.__instantApply(); });
  el._show = show;
}
bindSlider('fade', v => v + ' ms');
bindSlider('afade', v => v + ' ms');
bindSlider('radius', v => v + ' px');
bindSlider('low', v => (v/100).toFixed(2));
bindSlider('high', v => (v/100).toFixed(2));
bindSlider('posX', v => (v>0?'+':'') + v + '%');
bindSlider('posY', v => v + '%');
bindSlider('fx', v => v + '%');
bindSlider('sens', v => (v/100).toFixed(2) + 'x');
bindSlider('edgeW', v => v + '%');
bindSlider('edgeL', v => v + '%');
bindSlider('dth', v => (v/100).toFixed(2));
bindSlider('cburst', v => (v/100).toFixed(2));
bindSlider('duckFire', v => (v/100).toFixed(2));
bindSlider('duckWalk', v => (v/100).toFixed(2));
bindSlider('duckRel', v => v + ' ms');
bindSlider('duckCone', v => v + '°');
for (let i = 0; i < 8; i++) bindSlider('w' + i, v => (v/100).toFixed(2));

function setMode(m) { /* mode UI removed: always stereo */ }

function fillSelect(el, names) {
  const cur = el.selectedIndex;
  el.innerHTML = '';
  names.forEach(n => el.add(new Option(n, n)));
  if (cur >= 0 && cur < names.length) el.selectedIndex = cur;
}

function applyState(s) {
  state = s;
  fillSelect($('selIn'), s.devicesIn);
  fillSelect($('selOut'), s.devicesOut);
  if (s.selIn !== undefined && document.activeElement !== $('selIn')) $('selIn').selectedIndex = s.selIn;
  if (s.selOut !== undefined && document.activeElement !== $('selOut')) $('selOut').selectedIndex = s.selOut;
  const c = s.config;
  setMode(c.mode);
  $('ovOn').checked = !!c.overlay_enabled;
  $('clsOn').checked = !!c.classify_enabled;
  $('autoOn').checked = !!c.autostart;
  const set = (id, v) => { if (document.activeElement !== $(id)) { $(id).value = v; } $(id)._show(); };
  set('fade', c.fade_ms); set('radius', c.radar_radius);
  set('afade', c.arrow_fade_ms !== undefined ? c.arrow_fade_ms : 500);
  set('low', Math.round(c.overlay_low*100)); set('high', Math.round(c.overlay_high*100));
  set('posX', c.pos_x_pct); set('posY', c.pos_y_pct); set('fx', c.overlay_fx);
  if (c.sensitivity !== undefined) set('sens', Math.round(c.sensitivity*100));
  if (c.edge_width !== undefined) set('edgeW', c.edge_width);
  if (c.edge_len !== undefined) set('edgeL', c.edge_len);
  set('dth', Math.round((c.detect_threshold !== undefined ? c.detect_threshold : 0.01)*200)/2);
  set('cburst', Math.round((c.classify_burst !== undefined ? c.classify_burst : 0.005)*200)/2);
  $('fmerge').checked = c.front_merge !== undefined ? !!c.front_merge : true;
  $('hideImp').checked = c.hide_impact !== undefined ? !!c.hide_impact : false;
  $('duckOn').checked = c.duck_enabled !== undefined ? !!c.duck_enabled : true;
  set('duckFire', Math.round((c.duck_fire !== undefined ? c.duck_fire : 0.85)*100));
  set('duckWalk', Math.round((c.duck_walk !== undefined ? c.duck_walk : 0.65)*100));
  set('duckRel', c.duck_release_ms !== undefined ? c.duck_release_ms : 300);
  set('duckCone', c.duck_cone_deg !== undefined ? c.duck_cone_deg : 50);
  for (let i = 0; i < 8; i++) set('w' + i, Math.round(c.weights[i]*100));
  const dot = $('dot');
  dot.className = 'dot ' + (s.status.running ? 'ok' : (s.status.error ? 'err' : 'warn'));
  $('statusText').textContent = s.status.text;
  for (let i = 0; i < 8; i++) {
    const lv = Math.min(1, s.levels[i] || 0);
    const b = $('bar' + i);
    b.style.height = (2 + lv * 20) + 'px';
    b.style.background = lv > c.overlay_high ? '#ff5040' :
                         lv > c.overlay_low ? '#e8b93f' : '#00d2c8';
  }
}

function collectConfig() {
  return {
    mode: 'stereo', // downmix mode UI removed; stereo passthrough always
    overlay_enabled: $('ovOn').checked,
    classify_enabled: $('clsOn').checked,
    autostart: $('autoOn').checked,
    fade_ms: +$('fade').value,
    arrow_fade_ms: +$('afade').value,
    radar_radius: +$('radius').value,
    overlay_low: (+$('low').value)/100,
    overlay_high: (+$('high').value)/100,
    pos_x_pct: +$('posX').value,
    pos_y_pct: +$('posY').value,
    overlay_fx: +$('fx').value,
    sensitivity: (+$('sens').value)/100,
    edge_width: +$('edgeW').value,
    edge_len: +$('edgeL').value,
    detect_threshold: (+$('dth').value)/100,
    classify_burst: (+$('cburst').value)/100,
    front_merge: $('fmerge').checked,
    hide_impact: $('hideImp').checked,
    duck_enabled: $('duckOn').checked,
    duck_fire: (+$('duckFire').value)/100,
    duck_walk: (+$('duckWalk').value)/100,
    duck_release_ms: +$('duckRel').value,
    duck_cone_deg: +$('duckCone').value,
    weights: [0,1,2,3,4,5,6,7].map(i => (+$('w'+i).value)/100)
  };
}
const post = o => window.chrome.webview.postMessage(o);
// sliders/toggles apply instantly (debounced 200 ms after the last input)
let applyTimer = null;
function autoApply() {
  clearTimeout(applyTimer);
  applyTimer = setTimeout(() => post({cmd:'apply', selIn: $('selIn').selectedIndex,
                                      selOut: $('selOut').selectedIndex,
                                      config: collectConfig()}), 200);
}
$('content').addEventListener('input', e => {
  if (e.target.type === 'range' || e.target.type === 'checkbox') autoApply();
});
$('content').addEventListener('change', e => { if (e.target.tagName === 'SELECT' && e.target.id !== 'preset') autoApply(); });
$('btnApply').onclick = () => post({cmd:'apply', selIn: $('selIn').selectedIndex,
                                    selOut: $('selOut').selectedIndex, config: collectConfig()});
$('btnMin').onclick = () => post({cmd:'minimize'});
$('btnExit').onclick = () => post({cmd:'exit'});
$('resetW').onclick = () => post({cmd:'resetWeights'});
$('btnTitleMin').onclick = () => post({cmd:'minimize'});
$('btnTitleClose').onclick = () => post({cmd:'minimize'});
$('btnSetDefault').onclick = () => post({cmd:'setDefault', selIn: $('selIn').selectedIndex});
$('btnExport').onclick = () => post({cmd:'exportConfig'});
$('btnImport').onclick = () => post({cmd:'importConfig'});

// self-update: states 1 checking, 2 up-to-date, 3 available, 4 downloading,
// 5 ready (swap runs on app exit), 6 error
$('btnCheckUpdate').onclick = () => post({cmd:'checkUpdate'});
$('btnDoUpdate').onclick = () => post({cmd:'doUpdate'});
function onUpdate(u) {
  const t = $('updText');
  $('btnDoUpdate').hidden = true;
  switch (u.state) {
    case 1: t.textContent = '正在检查更新…'; break;
    case 2: t.textContent = '已是最新版本'; break;
    case 3: t.textContent = '发现新版本 v' + u.latest; $('btnDoUpdate').hidden = false; break;
    case 4: t.textContent = u.message || '正在下载更新…'; break;
    case 5: t.textContent = '更新完成，重启应用后生效'; break;
    case 6: t.textContent = '更新失败：' + (u.message || '未知错误'); break;
  }
}

const PRESETS = {
  default: { name:'默认', sensitivity:2.0, overlay_low:0.08, overlay_high:0.30, detect_threshold:0.01, classify_burst:0.005, classify_low_ratio:2.5, classify_min_crest:2.0, classify_spacing_min_ms:250, classify_spacing_max_ms:700, classify_impact_ms:60, classify_impact_ratio:2.0, classify_impact_crest:1.8, arrow_fade_ms:500, duck_enabled:true, duck_fire:0.85, duck_walk:0.65, duck_release_ms:300, duck_cone_deg:50, front_merge:true, hide_impact:false },
  cs2:     { name:'CS2', sensitivity:2.2, overlay_low:0.08, overlay_high:0.30, detect_threshold:0.01, classify_burst:0.005, classify_low_ratio:1.5, classify_min_crest:2.0, classify_spacing_min_ms:250, classify_spacing_max_ms:700, classify_impact_ms:60, classify_impact_ratio:2.0, classify_impact_crest:1.8, arrow_fade_ms:500, duck_enabled:true, duck_fire:0.85, duck_walk:0.65, duck_release_ms:300, duck_cone_deg:50, front_merge:true, hide_impact:false },
  valorant:{ name:'无畏契约', sensitivity:3.0, overlay_low:0.08, overlay_high:0.30, detect_threshold:0.01, classify_burst:0.005, classify_low_ratio:2.0, classify_min_crest:1.8, classify_spacing_min_ms:250, classify_spacing_max_ms:700, classify_impact_ms:60, classify_impact_ratio:2.2, classify_impact_crest:1.8, arrow_fade_ms:500, duck_enabled:true, duck_fire:0.85, duck_walk:0.65, duck_release_ms:300, duck_cone_deg:50, front_merge:true, hide_impact:true },
  delta:   { name:'三角洲行动', sensitivity:3.0, overlay_low:0.08, overlay_high:0.30, detect_threshold:0.01, classify_burst:0.005, classify_low_ratio:2.0, classify_min_crest:1.8, classify_spacing_min_ms:220, classify_spacing_max_ms:750, classify_impact_ms:60, classify_impact_ratio:2.0, classify_impact_crest:1.8, arrow_fade_ms:600, duck_enabled:true, duck_fire:0.85, duck_walk:0.70, duck_release_ms:350, duck_cone_deg:50, front_merge:true, hide_impact:false }
};
// load: set the controls that exist, then post apply with the control-less
// classify_* keys merged in (collectConfig alone would drop them)
function loadPreset(key) {
  const p = PRESETS[key];
  if (!p) return;
  const set = (id, v) => { $(id).value = v; $(id)._show(); };
  set('sens', Math.round(p.sensitivity*100));
  set('low', Math.round(p.overlay_low*100));
  set('high', Math.round(p.overlay_high*100));
  set('dth', Math.round(p.detect_threshold*200)/2);
  set('cburst', Math.round(p.classify_burst*200)/2);
  set('afade', p.arrow_fade_ms);
  set('duckFire', Math.round(p.duck_fire*100));
  set('duckWalk', Math.round(p.duck_walk*100));
  set('duckRel', p.duck_release_ms);
  set('duckCone', p.duck_cone_deg);
  $('fmerge').checked = !!p.front_merge;
  $('hideImp').checked = !!p.hide_impact;
  $('duckOn').checked = !!p.duck_enabled;
  const cfg = Object.assign(collectConfig(), {
    classify_low_ratio: p.classify_low_ratio,
    classify_min_crest: p.classify_min_crest,
    classify_spacing_min_ms: p.classify_spacing_min_ms,
    classify_spacing_max_ms: p.classify_spacing_max_ms,
    classify_impact_ms: p.classify_impact_ms,
    classify_impact_ratio: p.classify_impact_ratio,
    classify_impact_crest: p.classify_impact_crest
  });
  post({cmd:'apply', selIn: $('selIn').selectedIndex,
        selOut: $('selOut').selectedIndex, config: cfg});
}
$('btnPreset').onclick = () => loadPreset($('preset').value);

// instant-apply: toggles and device selects take effect without the Apply button
function instantApply() {
  post({cmd:'apply', selIn: $('selIn').selectedIndex,
        selOut: $('selOut').selectedIndex, config: collectConfig()});
}
window.__instantApply = instantApply;
for (const id of ['ovOn','clsOn','autoOn','fmerge','duckOn','hideImp']) $(id).onchange = instantApply;
$('selIn').onchange = instantApply;
$('selOut').onchange = instantApply;

// basic/advanced tabs; re-posting ready re-triggers the host auto-fit
function showTab(basic) {
  $('pageBasic').hidden = !basic;
  $('pageAdv').hidden = basic;
  $('tabBasic').classList.toggle('on', basic);
  $('tabAdv').classList.toggle('on', !basic);
  post({cmd:'ready'});
}
$('tabBasic').onclick = () => showTab(true);
$('tabAdv').onclick = () => showTab(false);
// frameless window drag (WebView2 does not implement -webkit-app-region itself)
$('titlebar').addEventListener('mousedown', e => {
  if (e.target.closest('.tbtn')) return;
  post({cmd:'drag', x: e.screenX, y: e.screenY});
});

window.chrome.webview.addEventListener('message', ev => {
  if (ev.data && ev.data.type === 'state') applyState(ev.data);
  else if (ev.data && ev.data.type === 'update') onUpdate(ev.data);
});
// diagnostics: report every real click to the host log
document.addEventListener('mousedown', e => {
  post({cmd:'debugClick', id: e.target.id || e.target.className || e.target.tagName});
}, true);
post({cmd:'ready'});
setTimeout(() => post({cmd:'checkUpdate'}), 2000); // one-shot auto update check
</script>
