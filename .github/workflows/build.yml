name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # engine/CMakeLists.txt expects the WebView2 NuGet package layout at
      # tools/webview2/build/native (headers + WebView2LoaderStatic.lib).
      # The repo only carries the runtime bits, so fetch the same SDK version.
      - name: Fetch WebView2 SDK build/native
        shell: pwsh
        run: |
          $ver = "1.0.4191.47"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$ver" -OutFile "$env:TEMP\wv2.zip"
          Expand-Archive "$env:TEMP\wv2.zip" "$env:TEMP\wv2pkg"
          New-Item -ItemType Directory -Force tools\webview2\build | Out-Null
          Copy-Item -Recurse -Force "$env:TEMP\wv2pkg\build\native" tools\webview2\build\

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $out = "release\SoundRadar"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build\engine\Release\SoundRadar.exe $out\
          Copy-Item "dist\SoundRadar\使用说明.txt" $out\
          Copy-Item "dist\SoundRadar\创建桌面快捷方式.bat" $out\
          Compress-Archive "$out" "SoundRadar-$env:GITHUB_REF_NAME.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SoundRadar-${{ github.ref_name }}.zip
          generate_release_notes: true
